name: Sync Base submission status

run-name: Sync Base status for run ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - Auto-test Workflow
    types:
      - completed

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      contains(github.event.workflow_run.display_title, 'base_record_id=rec')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Resolve record and final status
        id: submission
        env:
          RUN_NAME: ${{ github.event.workflow_run.display_title }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUN_NAME" =~ base_record_id=(rec[A-Za-z0-9]+) ]]; then
            record_id="${BASH_REMATCH[1]}"
          else
            echo "Workflow run name does not contain a valid Base record ID."
            exit 1
          fi

          if [[ "$CONCLUSION" == "success" ]]; then
            status="成功"
          else
            status="失败"
          fi

          echo "record_id=$record_id" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Update Feishu Base record
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}
          LARK_BASE_TABLE_ID: ${{ secrets.LARK_BASE_TABLE_ID }}
          RECORD_ID: ${{ steps.submission.outputs.record_id }}
          FINAL_STATUS: ${{ steps.submission.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail

          for variable in \
            LARK_APP_ID \
            LARK_APP_SECRET \
            LARK_BASE_TOKEN \
            LARK_BASE_TABLE_ID; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required GitHub secret $variable is not configured."
              exit 1
            fi
          done

          token_response="$(
            curl --silent --show-error --fail-with-body \
              --retry 3 --retry-all-errors \
              --request POST \
              --header 'Content-Type: application/json; charset=utf-8' \
              --data "$(jq -cn \
                --arg app_id "$LARK_APP_ID" \
                --arg app_secret "$LARK_APP_SECRET" \
                '{app_id: $app_id, app_secret: $app_secret}')" \
              'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal'
          )"

          if [[ "$(jq -r '.code' <<<"$token_response")" != "0" ]]; then
            error_code="$(jq -r '.code // "unknown"' <<<"$token_response")"
            error_message="$(jq -r '.msg // "unknown error"' <<<"$token_response")"
            echo "Failed to obtain a Feishu tenant access token: $error_code $error_message"
            exit 1
          fi
          tenant_access_token="$(jq -r '.tenant_access_token' <<<"$token_response")"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          if ! http_status="$(
            curl --silent --show-error \
              --retry 3 --retry-all-errors \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request PUT \
              --header "Authorization: Bearer $tenant_access_token" \
              --header 'Content-Type: application/json; charset=utf-8' \
              --data "$(jq -cn --arg status "$FINAL_STATUS" \
                '{fields: {"状态": $status}}')" \
              "https://open.feishu.cn/open-apis/bitable/v1/apps/${LARK_BASE_TOKEN}/tables/${LARK_BASE_TABLE_ID}/records/${RECORD_ID}"
          )"; then
            echo "The Feishu Base request failed at the transport layer."
            exit 1
          fi
          update_response="$(<"$response_file")"

          response_code="$(jq -r '.code // "unknown"' <<<"$update_response")"
          if [[ ! "$http_status" =~ ^2 ]] || [[ "$response_code" != "0" ]]; then
            response_message="$(jq -r '.msg // "unknown error"' <<<"$update_response")"
            echo "Feishu Base rejected the status update: HTTP $http_status, code $response_code, message $response_message"
            exit 1
          fi
